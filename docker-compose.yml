# PostgreSQL 18 for local development + an isolated test database (T-10, T-23).
# PG18 is required for native uuidv7() (identifier-strategy §2). Credentials come
# from the root .env (POSTGRES_*) — never hardcoded (security-guidelines §Secrets).
#
#   docker compose up -d            → dev DB on :5432
#   docker compose --profile test up -d   → also start the test DB on :5433
services:
  postgres:
    image: postgres:18
    container_name: pulse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Host 55432 avoids collision with a native host PostgreSQL on 5432.
      - "55432:5432"
    volumes:
      # PG18+ images store data in a major-version subdirectory; mount the parent.
      - pulse_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Ephemeral test DB (no named volume → state never persists between runs).
  # Started only with `--profile test`; consumed by the integration suite (T-23).
  postgres-test:
    image: postgres:18
    container_name: pulse-postgres-test
    profiles: ["test"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: pulse_test
    ports:
      - "55433:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d pulse_test"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pulse_pgdata:
